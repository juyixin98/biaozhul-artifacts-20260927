# 三方合并后端配置。路径相对项目根目录解析；可用环境变量 MERGE3_CONFIG 指定其他配置文件。
storage:
  # 所有本地状态：SQLite 元数据库、Parquet 快照、运行日志
  root_dir: ./data
  db_filename: metadata.db
  parquet_dirname: snapshots
  log_dirname: logs

api:
  host: 127.0.0.1
  port: 8000

runlog:
  # 判定依据是否逐条记录（每个记录键的结论与理由）
  include_per_key_decisions: true
