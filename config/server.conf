# Petri reachability backend configuration.
#
# Loaded from the path in PN_CONFIG_FILE (default: config/server.conf).
# Every key here can also be overridden by an environment variable:
#   PN_HTTP_BIND, PN_MAX_STATES_CEILING, PN_LOG_LEVEL.
# Lines starting with '#' are comments; format is KEY=VALUE.

# Address and port the HTTP server binds.
http_bind=127.0.0.1:8080

# Hard ceiling on markings expanded per analysis. A client-supplied
# max_states is clamped to this value; the clamp is logged.
max_states_ceiling=1000000

# Tracing verbosity (error|warn|info|debug|trace).
log_level=info
