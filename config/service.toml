# 湖表元数据事务服务配置（TOML，Python 3.11+ tomllib 原生读取）
# 路径相对于本配置文件所在目录解析；可用环境变量 LAKE_TXN_CONFIG 指向其他配置。

[warehouse]
# 本地仓库根目录：相对本配置文件目录（config/）解析，上一级即项目根
root = "../.local-data/warehouse"
# SQLite 元数据文件名（位于 root 下）
db_name = "metadata.sqlite3"
# 暂存区目录名（位于 root 下）
staging_dir = "staging"
# 隔离区目录名（失败文件/孤立文件移入此处而非直接删除，位于 root 下）
quarantine_dir = "quarantine"
# 孤立文件宽限秒数：mtime 小于该值的文件视为在途，清扫器不动
orphan_grace_seconds = 300

[security]
# 日志中需要脱敏的字段名（大小写不敏感，按字典键匹配）
redact_fields = ["ssn", "email", "token", "secret", "password", "id_card"]
# 允许 import 模式读取的外部本地目录白名单；目录之外一律拒绝
allowed_inbound_dirs = ["../examples/inbound"]
