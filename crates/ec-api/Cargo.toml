[package]
name = "ec-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Service layer and Axum HTTP API for the erasure-coding service"

[dependencies]
ec-core.workspace = true
ec-format.workspace = true
ec-store.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "macros"] }
tower = "0.5.3"
tracing.workspace = true
uuid = { version = "1.26.1", features = ["v4"] }
base64 = "0.22.1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = "0.3.23"
ec-store = { path = "../ec-store" }
