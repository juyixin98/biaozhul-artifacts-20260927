[workspace]
resolver = "2"
members = [
    "crates/huff-core",
    "crates/huff-store",
    "crates/huff-api",
    "crates/huff-it",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "local/huff-canonical"

[workspace.dependencies]
huff-core = { path = "crates/huff-core" }
huff-store = { path = "crates/huff-store" }
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tower-log"] }
hyper = { version = "=1.8.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.13", features = ["tokio"] }
http-body-util = "=0.1.3"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.148"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
