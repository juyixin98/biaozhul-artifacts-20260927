[workspace]
members = [
    "crates/fsm-lang",
    "crates/fsm-core",
    "crates/fsm-evidence",
    "crates/fsm-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"

fsm-lang = { path = "crates/fsm-lang" }
fsm-core = { path = "crates/fsm-core" }
fsm-evidence = { path = "crates/fsm-evidence" }
