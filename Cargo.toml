[package]
name = "lz77b"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "LZ77 block compression backend with sliding dictionary, independent and chained blocks"
license = "MIT"

[lib]
name = "lz77b"
path = "src/lib.rs"

[[bin]]
name = "lz77b-server"
path = "src/bin/server.rs"

[[bin]]
name = "lz77b"
path = "src/bin/cli.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tower-log", "tracing"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "net", "sync", "macros"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"

[profile.release]
lto = "thin"
