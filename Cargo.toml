[package]
name = "hcomp"
version = "0.1.0"
edition = "2021"
description = "Canonical Huffman compression codec with a block-directory container, filesystem store and Axum verification API"
license = "MIT"

[lib]
name = "hcomp"
path = "src/lib.rs"

[[bin]]
name = "hcompd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
async-trait = "0.1.85"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
tempfile = "3.15"

[profile.release]
lto = "thin"
