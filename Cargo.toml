[package]
name = "rangecode"
version = "0.1.0"
edition = "2021"
description = "Fixed-precision range encoder/decoder with static frequency tables and chunked containers"
license = "MIT OR Apache-2.0"

[lib]
name = "rangecode"
path = "src/lib.rs"

[[bin]]
name = "rangecode"
path = "src/bin/rangecode.rs"
required-features = ["server"]

[features]
default = ["server"]
server = ["dep:axum", "dep:tower"]

[dependencies]
axum = { version = "0.7", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# serde_json is already a normal dependency (used by the server); repeat it
# here so integration tests can parse golden-vector fixtures directly.
serde_json = "1"
# The Python reference (`tools/reference_rangecoder.py`) is invoked as a
# plain python3 subprocess when an interpreter is available — no crate needed.
