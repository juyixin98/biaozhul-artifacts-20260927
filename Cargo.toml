[package]
name = "bdd-backend"
version = "0.1.0"
edition = "2021"
description = "ROBDD backend for Boolean functions: build, apply, restrict, equivalence"
license = "MIT"

[lib]
name = "bdd_backend"
path = "src/lib.rs"

[[bin]]
name = "bdd-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
