[package]
name = "cnf-solver-backend"
version = "0.1.0"
edition = "2021"
description = "DIMACS CNF solving backend: DPLL with two-watched literals, deterministic branching, verifiable SAT/UNSAT evidence"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
hyper = "1"
