[package]
name = "ec-service"
version = "0.1.0"
edition = "2021"
description = "Local Reed-Solomon (k data + m parity shards) erasure-coding service over Axum and a filesystem store"
license = "MIT"

[lib]
name = "ec_service"
path = "src/lib.rs"

[[bin]]
name = "ec-service"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
# Integration tests use only std::net for HTTP; no extra test crates.

[profile.release]
lto = "thin"
