[package]
name = "mphf"
version = "0.1.0"
edition = "2021"
description = "Immutable-key minimal perfect hash (BDZ-style 3-hypergraph peeling) build/query service"
license = "MIT"

[lib]
name = "mphf"
path = "src/lib.rs"

[[bin]]
name = "mphfd"
path = "src/bin/mphfd.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
lto = "thin"
