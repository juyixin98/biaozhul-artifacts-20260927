[workspace]
resolver = "3"
members = [
    "crates/hbs-core",
    "crates/hbs-format",
    "crates/hbs-store",
    "crates/hbs-config",
    "crates/hbs-server",
    "crates/hbs-cli",
    "crates/hbs-testkit",
    "crates/hbs-tests",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
version = "0.1.0"

# All external dependency versions are pinned exactly so a build is
# reproducible from Cargo.lock and from these declarations alone.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["full"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.26.1", features = ["v4"] }
http-body-util = "=0.1.5"

[profile.release]
lto = "thin"
codegen-units = 1
