[package]
name = "mph-service"
version = "0.1.0"
edition = "2021"
description = "Minimal perfect hash (BDZ graph-peeling) build & query service for immutable key sets"

[lib]
name = "mph_service"
path = "src/lib.rs"

[[bin]]
name = "mph-service"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
