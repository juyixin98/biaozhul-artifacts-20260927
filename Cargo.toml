[package]
name = "deletable-cuckoo"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "支持凭证删除的 Cuckoo 近似成员过滤器 HTTP 服务"
license = "MIT"

[lib]
name = "deletable_cuckoo"
path = "src/lib.rs"

[[bin]]
name = "cf-svc"
path = "src/main.rs"

# 关键依赖全部锁定到精确版本，配合提交的 Cargo.lock 保证可复现构建。
[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"
sha2 = "=0.10.9"
hmac = "=0.12.1"
hex = "=0.4.3"
base64 = "=0.22.1"
rand = "=0.8.8"
rand_chacha = "=0.3.1"
getrandom = "=0.2.15"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "json", "env-filter"] }

[dev-dependencies]
tempfile = "=3.14.0"

[profile.release]
lto = "thin"
codegen-units = 1
