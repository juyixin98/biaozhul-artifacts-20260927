[package]
name = "prereg2d"
version = "0.1.0"
edition = "2021"
description = "Offline 2D point-increment / rectangle-sum backend on pre-registered coordinates"
license = "MIT OR Apache-2.0"

[lib]
name = "prereg2d"
path = "src/lib.rs"

[[bin]]
name = "prereg2d-server"
path = "src/main.rs"

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.40.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.151"
serde_urlencoded = "=0.7.1"
toml = "=1.0.0"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", default-features = false, features = ["fmt", "ansi", "env-filter"] }
http-body-util = "=0.1.2"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
tempfile = "=3.13.0"

[lints.rust]
unsafe_code = "forbid"
