[workspace]
resolver = "2"
members = [
    "crates/rb-format",
    "crates/rb-persist",
    "crates/rb-server",
    "crates/rb-testkit",
    "crates/rbtool",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "local://hierarchical-bitmap-set"

# 所有外部依赖固定到精确版本（patch 版本也锁定），Cargo.lock 一并提交以保证可复现构建。
[workspace.dependencies]
anyhow = "=1.0.104"
axum = "=0.7.9"
axum-core = "=0.4.5"
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = "=1.11.1"
mime = "=0.3.17"
once_cell = "=1.21.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "ansi", "smallvec", "env-filter", "json"] }
uuid = { version = "=1.26.1", features = ["v4"] }

rb-format = { path = "crates/rb-format" }
rb-persist = { path = "crates/rb-persist" }
rb-testkit = { path = "crates/rb-testkit" }

[profile.release]
codegen-units = 1
