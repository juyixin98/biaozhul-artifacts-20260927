[package]
name = "lz77-blocks"
version = "0.1.0"
edition = "2021"
description = "LZ77 sliding-window block compression backend with independent and dependent blocks (Axum + filesystem)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[lints.clippy]
all = "warn"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
panic = "unwind"

[[bin]]
name = "lz77-blocks"
path = "src/main.rs"
