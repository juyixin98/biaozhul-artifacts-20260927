[package]
name = "petri-reach"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Reachability analysis backend for ordinary weighted Petri nets with explicit capacity bounds"

[lib]
name = "petri_reach"
path = "src/lib.rs"

[[bin]]
name = "petri-reach"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
