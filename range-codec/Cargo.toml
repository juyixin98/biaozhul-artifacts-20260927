[package]
name = "range-codec"
version = "0.1.0"
edition = "2021"
description = "Fixed-precision range encoder/decoder with static frequency tables and a chunked container"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
