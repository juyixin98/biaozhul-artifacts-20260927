# local-txpool 默认配置（纯本地合成环境，无任何生产依赖）
# 所有金额单位均为 wei，所有时间均为 Unix 秒。

[chain]
# EIP-155 chain id；签名中的 v 必须与此一致
chain_id = 31337
# 候选区块的气体上限（propose 时可用参数覆盖）
block_gas_limit = 10000000

[pool]
# 每个账户在可执行前缀中最多保留的交易数（仅用于容量记账）
max_account_pending = 16
# 每个账户最多保留的带缺口等待交易数
max_account_queued = 64
# 内存池全局活跃交易上限（pending + queued）
max_global = 4096
# 全局 queued 子队列上限
max_global_queued = 1024
# 新交易相对账户链上 nonce 允许提前的最大距离
max_future_nonce = 64
# 替换同 nonce 交易所需的 gas_price 涨价百分比（new >= old*(100+bump)/100）
price_bump_pct = 10
# 交易存活秒数；收到时刻 + ttl 即过期
ttl_seconds = 3600
# 后台过期扫描间隔秒数；0 = 关闭后台扫描（只在提交/提议时惰性扫描）
sweep_interval_seconds = 0

[storage]
# SQLite 数据库文件；":memory:" 表示仅进程内
path = "./data/txpool.db"

[api]
host = "127.0.0.1"
port = 8000

[log]
# DEBUG/INFO/WARNING/ERROR
level = "INFO"
# true = JSON 行日志（机器可复核），false = 文本日志
json = true
