[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teaching-chain"
version = "1.0.0"
description = "教学链：确定性小型状态机与 gas 计费（VM / 编码验签 / 链状态内核 / 索引存储 / 离线回放）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<2.10",
    "cryptography>=44.0,<45.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<8.4", "httpx>=0.28,<0.29"]

[project.scripts]
teaching-chain = "teaching_chain.cli:main"
teaching-chain-replay = "teaching_chain.replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: 需要 HTTP 服务的集成测试（默认跳过，见 tests/README）",
]
