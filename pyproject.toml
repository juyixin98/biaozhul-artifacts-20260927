[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-txpool"
version = "1.0.0"
description = "Local account-based transaction pool backend (nonce ordering, fee replacement, block confirm/rollback)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "eth-keys==0.5.1",
    "eth-hash[pycryptodome]==0.7.0",
    "pycryptodome==3.21.0",
]

[project.optional-dependencies]
# rlp is the INDEPENDENT oracle used by tests to cross-check our hand-rolled RLP codec.
# It is never imported by package runtime code.
test = [
    "rlp==4.0.1",
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[project.scripts]
local-txpool = "localtxpool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localtxpool = ["storage/schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
