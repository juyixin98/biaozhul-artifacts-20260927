[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reorgindex"
version = "0.1.0"
description = "Reorg-aware revocable derived index for a synthetic local blockchain"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "cryptography>=41,<46",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<8.4"]

[project.scripts]
reorgindex = "reorgindex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
