[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rational-resampler"
version = "1.0.0"
description = "Mono PCM rational-ratio polyphase FIR resampling service"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.3",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
