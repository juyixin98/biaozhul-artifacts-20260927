[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smt-state-service"
version = "1.0.0"
description = "Fixed 256-bit-key sparse Merkle state service with membership/non-membership proofs"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
smt-replay = "smt.tools.replay:main"
smt-seed = "smt.tools.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "independent_tests"]
pythonpath = ["src", "."]
