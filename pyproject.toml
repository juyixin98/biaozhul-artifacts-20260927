[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-txpool"
version = "1.0.0"
description = "本地合成账户交易池后端（nonce/费用/容量管理、确认与回滚）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "coincurve>=20.0,<21.0",
    "eth-keys>=0.5,<1.0",
    "eth-utils>=5.0,<6.0",
    "rlp>=4.0,<5.0",
    "pycryptodome>=3.20,<4.0",
    "cryptography>=41.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
local-txpool = "local_txpool.cli:main"

[tool.setuptools]
packages = ["local_txpool", "local_txpool.api", "local_txpool.core",
            "local_txpool.offline", "local_txpool.storage"]
