[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-deleter"
version = "1.0.0"
description = "湖表读时删除应用器：文件行号删除 + 主键等值删除"
requires-python = ">=3.10"
dependencies = [
    "pyarrow==25.0.1",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
deleter = "deleter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "scenario: 端到端语义场景测试",
    "errors: 错误分类测试",
]
