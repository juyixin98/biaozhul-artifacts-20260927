[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsv"
version = "0.1.0"
description = "Restricted stack-script verification for local test transactions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.9",
    "cryptography>=41",
]

[project.scripts]
rsv-serve = "rsv.api.app:main"
rsv-replay = "rsv.scripts_cli:replay_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
