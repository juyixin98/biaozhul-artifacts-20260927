[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parquet-nested-verifier"
version = "1.0.0"
description = "Read/write verification backend for restricted Parquet nested lists and nullable structs"
requires-python = ">=3.11"
dependencies = [
    "pyarrow==17.0.0",
    "fastparquet==2024.11.0",
    "fastapi==0.115.2",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "httpx==0.27.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-ra"
