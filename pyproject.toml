[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merge3-backend"
version = "1.0.0"
description = "Structure-preserving three-way text merge backend (FastAPI + SQLite)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
merge3-server = "merge3.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
