[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arrow-zero-copy-views"
version = "0.1.0"
description = "Safe import, zero-copy slice and concat backend for Arrow column buffers"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=15,<26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v --log-cli-level=INFO --log-cli-format='%(asctime)s %(levelname)s %(name)s [run=%(run_id)s fp=%(input_fp)s] %(message)s'"
log_cli = true
log_cli_level = "INFO"
markers = [
    "unit: tests that do not touch the network or HTTP layer",
    "integration: tests that drive the full FastAPI application",
]
