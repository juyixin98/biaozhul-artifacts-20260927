[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colstats-audit"
version = "1.0.0"
description = "列式文件（Parquet）min/max、NULL 计数及排序统计的审计后端"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=15.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
colstats-server = "colstats.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
