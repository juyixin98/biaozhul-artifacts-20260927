[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pruning-backend"
version = "1.0.0"
description = "Two-level (directory partition + file statistics) conservative pruning backend"
requires-python = ">=3.10"
dependencies = [
    "pyarrow==25.0.1",
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
pruning-server = "pruning.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
