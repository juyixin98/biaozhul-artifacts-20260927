[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clockalign"
version = "1.0.0"
description = "Two-track audio sampling-clock drift estimation and timeline correction backend"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

# The independent fixture generator under tools/ is run directly as a script
# (see scripts/generate_fixtures.py); it is intentionally not part of the
# installed service package.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
