[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffg-slash-detector"
version = "1.0.0"
description = "Local Casper-FFG style double-vote / surround-vote slashing evidence detector"
requires-python = ">=3.11"
dependencies = [
    "cryptography==41.0.7",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra -v"
