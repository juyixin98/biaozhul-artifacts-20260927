[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poldiff"
version = "1.0.0"
description = "Offline object-storage policy diff analyzer (synthetic fixtures only)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["diffanalyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
